# Safe starter config for geo-seo-engine.
# Do not put tokens, passwords, API keys or private customer data in this file.
project_name: Example Project
base_url: https://example.com
allowed_hosts:
  - example.com
start_urls:
  - https://example.com
sitemap_urls:
  - https://example.com/sitemap.xml
include_patterns:
  - "*"
exclude_patterns:
  - "/admin/*"
  - "/private/*"
output_dir: reports
http:
  timeout_seconds: 10
  follow_redirects: true
  user_agent: geo-seo-engine/0.1.0 (+https://example.com)
  retries: 1
crawler:
  max_pages: 100
  max_depth: 2
  crawl_delay_seconds: 1
  respect_robots_txt: true
privacy:
  store_raw_html: false
  store_response_headers: false
  redact_query_params: true
  collect_personal_data: false
integrations:
  google_search_console: false
  google_analytics: false
  pagespeed_insights: false
